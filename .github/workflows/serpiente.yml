name: Generar serpiente de contribuciones

on:
  workflow_dispatch:
  schedule:
    - cron: '37 12 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/serpiente.yml

permissions:
  contents: write

concurrency:
  group: serpiente
  cancel-in-progress: true

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Con STATS_TOKEN el gráfico incluye también las contribuciones privadas.
          github_token: ${{ secrets.STATS_TOKEN || github.token }}
          outputs: |
            dist/serpiente-light.svg?color_snake=#6443a5
            dist/serpiente-dark.svg?palette=github-dark&color_snake=#a98ff7

      # Los SVG van a la rama "output" para no llenar main de commits diarios.
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: Actualizar serpiente
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
