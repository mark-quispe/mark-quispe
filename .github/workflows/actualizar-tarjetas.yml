name: Actualizar tarjetas del perfil

on:
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/actualizar-tarjetas.yml
      - .github/scripts/tarjetas.py

permissions:
  contents: write

concurrency:
  group: tarjetas-del-perfil
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerar tarjetas
        env:
          # STATS_TOKEN (token personal de solo lectura) permite contar también
          # los repos privados. Sin él, solo se cuentan los públicos.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          PROFILE: ${{ github.repository_owner }}
        run: python3 -I .github/scripts/tarjetas.py
      - name: Guardar cambios
        run: |
          git add cards/stats-{light,dark}.svg cards/languages-{light,dark}.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualizar tarjetas del perfil'
          git pull --rebase
          git push
