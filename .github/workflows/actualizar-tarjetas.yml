                  "rank_icon": "github", "hide_border": "true",
                  "bg_color": "00000000", "title_color": purple,
                  "text_color": text, "icon_color": icon, "card_width": "400",
                  "disable_animations": "true", "custom_title": "Estadísticas de GitHub",
              })
              with urlopen("https://github-readme-stats.vercel.app/api?" + params, timeout=45) as response:
                  stats = response.read()
              ET.fromstring(stats)
              if b"github-rank-icon" not in stats or b"Total Stars Earned" not in stats:
                  raise SystemExit("El proveedor no devolvió una tarjeta de estadísticas válida")
              generated[f"stats-{theme}.svg"] = stats

              bars, labels = [], []
              x = 25
              for i, (language, count) in enumerate(entries):
                  width = 350 * count / total
                  color = colors[i]
                  bars.append(f'<rect x="{x:.3f}" y="55" width="{width:.3f}" height="9" fill="{color}"/>')
                  x += width
                  lx, ly = 30 + (i % 2) * 175, 89 + (i // 2) * 18
                  percent = f"{100 * count / total:.1f}".replace(".", ",")
                  labels.append(f'<circle cx="{lx}" cy="{ly}" r="4" fill="{color}"/>'
                                f'<text x="{lx+11}" y="{ly+4}" font-size="12">'
                                f'{escape(language)} {percent} %</text>')
              if not entries:
                  labels.append('<text x="25" y="89" font-size="13">Sin lenguajes detectados</text>')
              svg = (
                  '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="165" viewBox="0 0 400 165">'
                  '<title>Lenguajes por repositorio público</title>'
                  '<defs><clipPath id="bar"><rect x="25" y="55" width="350" height="9" rx="4.5"/></clipPath></defs>'
                  f'<g font-family="Segoe UI, Ubuntu, sans-serif" fill="#{text}">'
                  f'<text x="25" y="33" font-size="18" font-weight="600" fill="#{purple}">Lenguajes por repositorio</text>'
                  f'<g clip-path="url(#bar)">{"".join(bars)}</g>{"".join(labels)}'
                  '<text x="25" y="151" font-size="11">Por repositorio público con lenguaje principal identificado</text>'
                  '</g></svg>'
              )
              ET.fromstring(svg)
              generated[f"languages-{theme}.svg"] = svg.encode("utf-8")

          folder = Path("cards")
          folder.mkdir(exist_ok=True)
          for name, data in generated.items():
              (folder / name).write_bytes(data)
          PY
      - name: Guardar cambios
        run: |
          git add cards/stats-{light,dark}.svg cards/languages-{light,dark}.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Actualizar tarjetas del perfil'
          git pull --rebase
          git push
